<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title-cost desc-cost">
  <title id="title-cost">信託報酬の差による長期的な資産額の違い</title>
  <desc id="desc-cost">信託報酬が年0.1%の場合と年1%の場合で、長期的に資産額カーブがどのように差が開くかを示す仮定の試算例。金額の目盛り数値はなく、差が開く様子のみを示す。特定のファンドの数値ではない。</desc>
  <style>
    text { font-family: sans-serif; fill: #1a1a1a; }
    .axis { stroke: #d1d5db; stroke-width: 1.5; fill: none; }
    .axis-label { font-size: 14px; fill: #4a4a4a; }
    .line-low { stroke: #0e7c61; stroke-width: 2.5; fill: none; }
    .line-high { stroke: #b45309; stroke-width: 2.5; fill: none; }
    .legend { font-size: 14px; }
    .note { font-size: 13px; fill: #4a4a4a; text-anchor: middle; }
    .badge { font-size: 12px; fill: #ffffff; }
    .diff-label { font-size: 14px; font-weight: bold; text-anchor: middle; }
  </style>

  <!-- バッジ -->
  <rect x="460" y="12" width="320" height="26" rx="13" ry="13" fill="#b45309"/>
  <text class="badge" x="620" y="30" text-anchor="middle">仮定の試算例（特定のファンドの数値ではありません）</text>

  <!-- 軸 -->
  <line class="axis" x1="80" y1="330" x2="720" y2="330"/>
  <line class="axis" x1="80" y1="330" x2="80" y2="50"/>
  <polygon points="720,326 720,334 738,330" fill="#d1d5db"/>
  <polygon points="76,50 84,50 80,33" fill="#d1d5db"/>

  <text class="axis-label" x="400" y="360" text-anchor="middle">運用期間</text>
  <text class="axis-label" x="45" y="190" text-anchor="middle" transform="rotate(-90, 45, 190)">資産額</text>

  <!-- 期間目安（数値なし、相対的な位置のみ） -->
  <text x="120" y="348" font-size="12" fill="#4a4a4a" font-family="sans-serif" text-anchor="middle">開始</text>
  <text x="700" y="348" font-size="12" fill="#4a4a4a" font-family="sans-serif" text-anchor="middle">長期</text>

  <!-- 低コスト: 年0.1%（上のカーブ） -->
  <path class="line-low" d="M100,310 C200,290 300,250 400,200 S550,120 700,70"/>

  <!-- 高コスト: 年1%（下のカーブ） -->
  <path class="line-high" d="M100,310 C200,295 300,265 400,230 S550,175 700,140"/>

  <!-- 差を示す -->
  <line x1="680" y1="78" x2="680" y2="135" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text class="diff-label" x="680" y="112" fill="#b91c1c">コスト差の</text>
  <text class="diff-label" x="680" y="128" fill="#b91c1c" font-size="12">累積的影響</text>

  <!-- 中間地点の差 -->
  <line x1="400" y1="205" x2="400" y2="226" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- 凡例 -->
  <line x1="120" y1="62" x2="155" y2="62" stroke="#0e7c61" stroke-width="2.5"/>
  <text class="legend" x="165" y="67" fill="#0e7c61">信託報酬 年0.1% の場合</text>

  <line x1="420" y1="62" x2="455" y2="62" stroke="#b45309" stroke-width="2.5"/>
  <text class="legend" x="465" y="67" fill="#b45309">信託報酬 年1% の場合</text>

  <!-- 下部の注記 -->
  <line x1="60" y1="375" x2="740" y2="375" stroke="#e5e7eb" stroke-width="1"/>
  <text class="note" x="400" y="397">わずかなコスト差でも、長期間の複利運用では資産額に大きな差が生じます</text>
  <text class="note" x="400" y="415">※ 同一のリターンを仮定した概念的な比較です。実際の運用成果を示すものではありません</text>
</svg>
