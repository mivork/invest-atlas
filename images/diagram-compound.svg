<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title-compound desc-compound">
  <title id="title-compound">貯金と複利の伸び方の概念図</title>
  <desc id="desc-compound">貯金はほぼ直線的に増えるのに対し、複利運用では時間が経つほど加速度的に増えていく様子を示す概念図。数値目盛りはなく、傾向のみを表す。</desc>
  <style>
    text { font-family: sans-serif; fill: #1a1a1a; }
    .axis { stroke: #d1d5db; stroke-width: 2; fill: none; }
    .axis-label { font-size: 15px; fill: #4a4a4a; }
    .line-saving { stroke: #243b60; stroke-width: 2.5; fill: none; }
    .line-compound { stroke: #0e7c61; stroke-width: 2.5; fill: none; }
    .legend-text { font-size: 14px; }
    .note { font-size: 13px; fill: #4a4a4a; text-anchor: middle; }
    .concept-badge { font-size: 12px; fill: #ffffff; }
  </style>

  <!-- 概念図バッジ -->
  <rect x="640" y="12" width="140" height="26" rx="13" ry="13" fill="#243b60"/>
  <text class="concept-badge" x="710" y="30" text-anchor="middle">概念図（イメージ）</text>

  <!-- 軸 -->
  <line class="axis" x1="100" y1="320" x2="720" y2="320"/>
  <line class="axis" x1="100" y1="320" x2="100" y2="60"/>

  <!-- 軸矢印 -->
  <polygon points="720,315 720,325 740,320" fill="#d1d5db"/>
  <polygon points="95,60 105,60 100,40" fill="#d1d5db"/>

  <!-- 軸ラベル -->
  <text class="axis-label" x="410" y="355" text-anchor="middle">時間</text>
  <text class="axis-label" x="60" y="190" text-anchor="middle" transform="rotate(-90, 60, 190)">金額</text>

  <!-- 貯金（直線） -->
  <line class="line-saving" x1="100" y1="300" x2="700" y2="160"/>

  <!-- 複利（曲線） -->
  <path class="line-compound" d="M100,300 C200,290 350,260 450,220 S600,120 700,70"/>

  <!-- 差を示す両矢印 -->
  <line x1="680" y1="168" x2="680" y2="82" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="694" y="130" font-size="13" fill="#b45309" font-family="sans-serif">差</text>

  <!-- 凡例 -->
  <line x1="140" y1="80" x2="175" y2="80" stroke="#243b60" stroke-width="2.5"/>
  <text class="legend-text" x="185" y="85" fill="#243b60">貯金（ほぼ直線）</text>

  <line x1="140" y1="105" x2="175" y2="105" stroke="#0e7c61" stroke-width="2.5"/>
  <text class="legend-text" x="185" y="110" fill="#0e7c61">複利運用（加速的に増加）</text>

  <!-- 注記 -->
  <text class="note" x="400" y="390">時間が長いほど複利の効果は大きくなる傾向があります</text>
</svg>
